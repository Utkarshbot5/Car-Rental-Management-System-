# Render Blueprint: one-click deploy (Dashboard -> New -> Blueprint -> pick this repo)
services:
  - type: web
    name: car-rental-project
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
